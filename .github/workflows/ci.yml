name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-ledger-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: my-ledger-front/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
